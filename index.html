<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda de Contactos - Projeto 06</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <div class="container py-4">
    <header class="pb-3 mb-4 border-bottom text-center">
      <h1 class="display-6 fw-bold text-primary">Agenda de Contactos</h1>
      <p class="text-muted">Desenvolvimento Web III - CRUD com Integração ViaCEP</p>
    </header>

    <!-- Formulário de Registo / Edição -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0" id="form-titulo">Adicionar Contacto</h5>
      </div>
      <div class="card-body">
        <form id="form-contacto">
          <input type="hidden" id="contacto-id">

          <div class="row g-3">
            <div class="col-md-6">
              <label for="nome" class="form-label">Nome Completo *</label>
              <input type="text" class="form-control" id="nome" required>
            </div>

            <div class="col-md-6">
              <label for="email" class="form-label">E-mail *</label>
              <input type="email" class="form-control" id="email" required>
            </div>

            <div class="col-md-4">
              <label for="telefone" class="form-label">Telefone *</label>
              <input type="tel" class="form-control" id="telefone" placeholder="(11) 98765-4321" required>
            </div>

            <div class="col-md-4">
              <label for="data-nascimento" class="form-label">Data de Nascimento *</label>
              <input type="date" class="form-control" id="data-nascimento" required>
            </div>

            <div class="col-md-4">
              <label for="cep" class="form-label">CEP (Apenas números) *</label>
              <input type="text" class="form-control" id="cep" maxlength="9" placeholder="00000-000" required>
              <div id="cep-erro" class="text-danger small mt-1 d-none">CEP não encontrado.</div>
            </div>

            <div class="col-md-6">
              <label for="logradouro" class="form-label">Rua / Logradouro</label>
              <input type="text" class="form-control" id="logradouro" readonly>
            </div>

            <div class="col-md-2">
              <label for="numero" class="form-label">Número</label>
              <input type="text" class="form-control" id="numero">
            </div>

            <div class="col-md-4">
              <label for="bairro" class="form-label">Bairro</label>
              <input type="text" class="form-control" id="bairro" readonly>
            </div>

            <div class="col-md-8">
              <label for="localidade" class="form-label">Cidade</label>
              <input type="text" class="form-control" id="localidade" readonly>
            </div>

            <div class="col-md-4">
              <label for="uf" class="form-label">Estado (UF)</label>
              <input type="text" class="form-control" id="uf" readonly>
            </div>
          </div>

          <div class="mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-success" id="btn-gravar">Guardar Contacto</button>
            <button type="button" class="btn btn-secondary d-none" id="btn-cancelar">Cancelar Edição</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Tabela de Contactos -->
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Lista de Contactos</h5>
        <span class="badge bg-light text-dark" id="total-registos">0 contactos</span>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover table-striped mb-0">
            <thead class="table-light">
              <tr>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Telefone</th>
                <th>Nascimento</th>
                <th>Endereço Completo</th>
                <th class="text-center">Ações</th>
              </tr>
            </thead>
            <tbody id="tabela-contactos">
              <!-- Conteúdo inserido dinamicamente via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
